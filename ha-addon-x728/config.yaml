name: "Geekworm X728 UPS Daemon"
description: "Reads battery voltage, capacity and AC status from the Geekworm X728 UPS HAT and exposes them via a local REST API for the X728 integration."
version: "1.0.4"
slug: "x728-daemon"
init: false

# Needed to call the Supervisor API (POST /host/shutdown) for a clean shutdown
hassio_api: true
hassio_role: manager

# Persistent event log in /share (survives the host shutdown)
map:
  - share:rw

arch:
  - aarch64

# Hardware access
privileged:
  - SYS_RAWIO
devices:
  - /dev/i2c-1
  - /dev/gpiochip0
  - /dev/gpiochip1
  - /dev/gpiochip2
  - /dev/gpiochip3
  - /dev/gpiochip4

# The integration connects here
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "X728 REST API"

# User-configurable options
# Supported values: v1, v2.0, v2.1, v2.2, v2.3, v2.4, v2.5
options:
  hw_version: "v2.1"
  daemon_port: 8099
  poll_interval: 10
  shutdown_voltage: 3.0
  shutdown_capacity: 5
  shutdown_delay: 10
  ac_confirm_seconds: 20
  pulse_seconds: 2.0
  buzzer_on_ac_loss: true
  buzzer_interval: 10
  buzzer_beep_ms: 100
  buzzer_volume: 100
  gpio_chip: "autodetect"

schema:
  hw_version: list(v1.x/v2.0|v2.1|v2.2|v2.3|v2.4|v2.5)
  daemon_port: int(1024,65535)
  poll_interval: int(5,120)
  shutdown_voltage: float(0.0,4.5)
  shutdown_capacity: int(0,50)
  shutdown_delay: int(5,120)
  ac_confirm_seconds: int(5,120)
  pulse_seconds: float(1.0,2.5)
  buzzer_on_ac_loss: bool
  buzzer_interval: int(5,300)
  buzzer_beep_ms: int(20,500)
  buzzer_volume: int(10,100)
  gpio_chip: "list(autodetect|/dev/gpiochip0|/dev/gpiochip1|/dev/gpiochip2|/dev/gpiochip3|/dev/gpiochip4)"

image: "ghcr.io/iu1jvo/ha-addon-x728"
